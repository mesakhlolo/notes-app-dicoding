<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-bar title="Notes App" subtitle="Catat ide, jangan biarkan hilang."></app-bar>

    <main>
      <section>
        <p class="eyebrow">$ new-note</p>
        <h2>Tambah Catatan</h2>
        <note-form></note-form>
      </section>

      <section>
        <p class="eyebrow">$ ls notes</p>
        <h2>Daftar Catatan</h2>
        <div class="tabs" role="tablist">
          <button id="tab-active" class="tab active" type="button">
            Aktif <span id="count-active" class="badge">0</span>
          </button>
          <button id="tab-archived" class="tab" type="button">
            Arsip <span id="count-archived" class="badge">0</span>
          </button>
        </div>
        <note-list></note-list>
      </section>
    </main>

    <footer>
      <p>notes-app v1.0 &mdash; built with vanilla js</p>
    </footer>
    <loading-indicator></loading-indicator>
  </body>
</html>
